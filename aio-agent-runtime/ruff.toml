# 刻意保持最小规则集：只拦住会在运行时炸掉的问题，不做风格争论。
# 起因是一次 NameError——注解里引用了没导入的类型，函数一被调用就 500，
# 而单元测试恰好没覆盖那条分支。F821 能在 CI 里直接拦下这类问题。

line-length = 120
target-version = "py312"

exclude = [
    ".venv",
    "packages",      # 第三方归档源码，不在本仓库维护
    "artifacts",
    "var",
]

[lint]
select = [
    "E4",    # import 相关
    "E7",    # 语句层面的明显错误
    "E9",    # 语法错误 / IO 错误
    "F",     # pyflakes：未定义名(F821)、未使用导入(F401)、重复定义(F811) 等
]
