[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-connector-gateway"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx==0.28.1", "httpcore==1.0.9", "anyio==4.14.2", "cryptography==50.0.1",
  "rfc8785==0.1.4", "fastapi==0.139.2", "pydantic==2.13.4", "uvicorn==0.51.0",
  "PyJWT[crypto]==2.10.1"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "mcp==2.2.0"]

[project.scripts]
aio-connector-gateway = "aio_connector_gateway.main:main"

[tool.setuptools.packages.find]
where = ["src"]
