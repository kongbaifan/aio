[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-sandbox-manager"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aio-runtime-policy==0.1.0", "docker==7.1.0", "fastapi>=0.115.0", "httpx>=0.27.0", "pydantic>=2.6.0", "rfc8785==0.1.4", "uvicorn>=0.34.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
aio-sandbox-manager = "aio_sandbox_manager.main:main"
