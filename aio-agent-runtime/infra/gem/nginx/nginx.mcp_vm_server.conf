location ~ ^/vm/exec/browser/(.*)$ {
    # 检查是否来自自身代理
    if ($http_x_forwarded_from_self) {
        return 400 "Self-proxy loop detected";
    }

    # 移除 /vm/exec/browser 前缀
    rewrite ^/vm/exec/browser/(.*)$ /$1 break;

    proxy_set_header X-Forwarded-From-Self 1;

    proxy_pass http://localhost:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # 添加WebSocket支持
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    proxy_set_header X-Original-URI $request_uri;
    proxy_set_header X-Forwarded-Path $uri;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    keepalive_timeout 600s;
}
