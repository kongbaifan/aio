[program:ci_server]
environment=HOME="/home/user",USER="user"
command=/bin/bash -lc 'if [ "${ENABLE_CI_SERVER:-true}" = "true" ]; then exec /opt/python3.12/bin/python3.12 %(ENV_RUNTIME_PATH)s/python_server/start_server.py; else echo "Skip starting python server because ENABLE_CI_SERVER=${ENABLE_CI_SERVER}"; exec sleep infinity; fi'
directory=/home/user/.super_doubao/super-doubao-runtime
user=user
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
