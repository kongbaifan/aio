[program:nodejs-repl-server-22]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",NODEJS_REPL_PORT="8292"
command=/usr/local/bin/node22 /opt/repl-servers/nodejs/server.js
directory=/home/%(ENV_USER)s
autostart=%(ENV_AUTOSTART_NODEJS_REPL_22)s
autorestart=true
priority=90
user=%(ENV_USER)s
stdout_logfile=%(ENV_LOG_DIR)s/nodejs-repl-server-22.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
redirect_stderr=true
