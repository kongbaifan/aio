[program:vm_server]
environment=HOME="/home/user",USER="user"
command=%(ENV_RUNTIME_PATH)s/mcp_vm_server --port %(ENV_VM_SERVER_PORT)s
directory=/home/user/.super_doubao/super-doubao-runtime
user=user
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
