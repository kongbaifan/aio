[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aio-runtime-policy"
version = "0.1.0"
description = "Pure signed-runtime contracts shared by the platform and isolated Manager; no Docker authority"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6.0", "rfc8785==0.1.4", "cryptography==50.0.1"]

[tool.setuptools.packages.find]
where = ["src"]
