services:
  sandbox:
    build:
      context: ./apps/sandbox-lite
    environment:
      SANDBOX_HOST: 0.0.0.0
      SANDBOX_PORT: 8081
      SANDBOX_WORKSPACE_DIR: /workspace
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-local-dev-sandbox}
      SANDBOX_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
    expose:
      - "8081"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - sandbox-workspace:/workspace
    networks:
      - agent-internal
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  harness:
    build:
      context: ./apps/local-harness
    environment:
      HARNESS_HOST: 0.0.0.0
      HARNESS_PORT: 8080
      HARNESS_TOKEN: ${HARNESS_TOKEN:-local-dev-harness}
      SANDBOX_URL: http://sandbox:8081
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-local-dev-sandbox}
      # 容器里目录层级和裸机不同，显式指定项目根，不依赖标志物查找。
      HARNESS_PROJECT_ROOT: /app
      HARNESS_AUDIT_LOG: /app/var/audit.jsonl
      HARNESS_REQUIRE_TOOL_CONFIRMATION: ${HARNESS_REQUIRE_TOOL_CONFIRMATION:-true}
      # 模型目录来自挂载的 config/models.json，其中 apiKey 写的是下面这些变量名。
      # 值由宿主 .env 提供，不进镜像。
      FASTAI_API_KEY: ${FASTAI_API_KEY:-}
      ZMOON_API_KEY: ${ZMOON_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    depends_on:
      sandbox:
        condition: service_started
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config:/app/config:ro
      - ./skills:/app/skills:ro
      # 会话库和审计日志都在 var/，用命名卷保住，容器重建后历史还在。
      - harness-var:/app/var
    networks:
      - agent-internal
      - agent-egress
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

networks:
  agent-internal:
    internal: true
  agent-egress:

volumes:
  sandbox-workspace:
  harness-var:
